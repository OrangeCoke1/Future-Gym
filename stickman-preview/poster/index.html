<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>未来フィットネス 2126 · ポスター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;800&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#BEC3AD;--paper:#E9E8D8;--ink:#1D231E;--ivory:#F1F0E2;--acc:#E0704A;--muted:#5E665A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans JP",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{padding:28px 32px 8px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
header h1{margin:0;font:600 15px/1.2 Unbounded,sans-serif;letter-spacing:.03em}
header p{margin:0;color:var(--muted);max-width:72ch}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:28px;padding:20px 32px 40px;align-items:start}
figure{margin:0}
.sheet{position:relative}
canvas{display:block;width:100%;height:auto;aspect-ratio:600/847;background:var(--paper);box-shadow:0 1px 0 rgba(29,35,30,.08),0 18px 40px -24px rgba(29,35,30,.45)}
/* trim line: the 3 mm bleed outside it is cut off after printing */
.trim{position:absolute;inset:calc(3/847*100%) calc(3/600*100%);outline:1px dashed rgba(29,35,30,.35);pointer-events:none}
figcaption{margin-top:14px}
figcaption b{display:block;font:600 13px/1.3 Unbounded,sans-serif}
figcaption span{display:block;color:var(--muted);margin-top:4px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{font:500 12px/1 "Noto Sans JP",sans-serif;color:var(--ivory);background:var(--ink);border:0;border-radius:999px;padding:9px 14px;cursor:pointer}
button.sub{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(29,35,30,.35)}
button:disabled{opacity:.4;cursor:default}
#msg{padding:0 32px 32px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>未来フィットネス 2126 · ポスター（A1）</h1>
</header>
<main>
  <figure><div class="sheet"><canvas id="pA"></canvas><div class="trim"></div></div>
    <figcaption><b>A · ハーフトーン</b>
    <div class="btns"><button data-print="A" disabled>A1 印刷用 300 dpi</button><button class="sub" data-prev="A" disabled>プレビュー PNG</button></div></figcaption></figure>
  <figure><div class="sheet"><canvas id="pB"></canvas><div class="trim"></div></div>
    <figcaption><b>B · ジオメトリック</b>
    <div class="btns"><button data-print="B" disabled>A1 印刷用 300 dpi</button><button class="sub" data-prev="B" disabled>プレビュー PNG</button></div></figcaption></figure>
  <figure><div class="sheet"><canvas id="pC"></canvas><div class="trim"></div></div>
    <figcaption><b>C · 手描きウェーブ</b>
    <div class="btns"><button data-print="C" disabled>A1 印刷用 300 dpi</button><button class="sub" data-prev="C" disabled>プレビュー PNG</button></div></figcaption></figure>
  <figure><div class="sheet"><canvas id="pD"></canvas><div class="trim"></div></div>
    <figcaption><b>D · 線刻</b>
    <div class="btns"><button data-print="D" disabled>A1 印刷用 300 dpi</button><button class="sub" data-prev="D" disabled>プレビュー PNG</button></div></figcaption></figure>
  <figure><div class="sheet"><canvas id="pE"></canvas><div class="trim"></div></div>
    <figcaption><b>E · 等高線</b>
    <div class="btns"><button data-print="E" disabled>A1 印刷用 300 dpi</button><button class="sub" data-prev="E" disabled>プレビュー PNG</button></div></figcaption></figure>
  <figure><div class="sheet"><canvas id="pF"></canvas><div class="trim"></div></div>
    <figcaption><b>F · リソグラフ</b>
    <div class="btns"><button data-print="F" disabled>A1 印刷用 300 dpi</button><button class="sub" data-prev="F" disabled>プレビュー PNG</button></div></figcaption></figure>
</main>
<p id="msg"></p>
<script src="figure-a.js"></script>
<script src="figures.js"></script>
<script>
(async () => {
  // Layout units: the trimmed A1 sheet is 1800 × 2548 units (594 × 841 mm, 1 unit ≈ 0.33 mm). The 3 mm bleed adds
  // BL units on every side; backgrounds and texture run into it, everything that matters stays well inside the trim.
  // A poster is drawn once per scale k: k = 1 for the on-screen preview, k ≈ 3.9 for 300 dpi print.
  const W = 1800, H = 1800 * 841 / 594, BL = 1800 * 3 / 594, LW = W + 2 * BL, LH = H + 2 * BL;
  const PRINT_W = Math.round(600 / 25.4 * 300), PRINT_H = Math.round(847 / 25.4 * 300);   // 7087 × 10004 px
  const C = { paper: '#E9E8D8', ink: '#1D231E', ivory: '#F1F0E2', acc: '#E0704A' };
  // every Japanese character drawn on the canvases (the web font only loads the glyph ranges asked for)
  const JA = '未来フィットネスシステム体を読む全身オンライン深部温心拍数呼吸回分血中酸素乳大腿四頭筋出力関節負荷膝三角すべての筋肉に、値があるデータは概念シミュレーション・マシンが項目リアルタイム計測レポート中接続' +
    '測るほど、強くなる。スキャン身長' +
    'からだの地形図年、は地図になる。握力等高線＝体表熱量概念北' +            // E
    '年後も、しゃがむ。膝角度';                                               // F
  const fz = '"Noto Sans JP", sans-serif', fu = 'Unbounded, sans-serif';
  try {
    await Promise.all(['500', '700', '900'].map(w => document.fonts.load(`${w} 40px "Noto Sans JP"`, JA)));
    await Promise.all(['500', '600', '800'].map(w => document.fonts.load(`${w} 40px Unbounded`, 'BODY ONLINE SCAN FUTURE FITNESS SERIES FFS SIMULATED DATA TOPOGRAPHY RISO EDITION YEARS LATER 0123456789.%×℃/·|°')));
  } catch (e) {}
  const seeded = seed => { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; };

  // ---------- shared ----------
  function sheet(cv, k) {                          // size the canvas for scale k ('print' = 300 dpi); drawing coordinates = trim units
    if (k === 'print') { cv.width = PRINT_W; cv.height = PRINT_H; } else { cv.width = Math.round(LW * k); cv.height = Math.round(LH * k); }
    const x = cv.getContext('2d');
    x.setTransform(cv.width / LW, 0, 0, cv.height / LH, BL * cv.width / LW, BL * cv.height / LH);
    x.fillStyle = C.paper; x.fillRect(-BL, -BL, LW, LH);
    return x;
  }
  function grain(x, amt, rnd) {                    // print grain, one speck per layout unit (≈ 0.33 mm) at any scale
    const n = document.createElement('canvas'); n.width = Math.ceil(LW); n.height = Math.ceil(LH);
    const g = n.getContext('2d'), im = g.createImageData(n.width, n.height), d = im.data;
    for (let i = 0; i < d.length; i += 4) { const v = 128 + (rnd() - 0.5) * amt * 2; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
    g.putImageData(im, 0, 0);
    x.save(); x.globalCompositeOperation = 'overlay'; x.imageSmoothingEnabled = false; x.drawImage(n, -BL, -BL, n.width, n.height); x.restore();
  }
  function fitText(x, s, font, maxW, size) {       // largest size (≤ size) that fits maxW
    for (; size > 10; size -= 4) { x.font = font.replace('#', size); if (x.measureText(s).width <= maxW) break; }
    return size;
  }
  function label(x, px, py, name, val, unit, col) {   // returns the label's width
    x.fillStyle = col; x.textBaseline = 'alphabetic'; x.textAlign = 'left';
    x.font = `700 30px ${fz}`; x.fillText(name, px, py);
    x.font = `600 58px ${fu}`; x.fillText(val, px, py + 70); const w = x.measureText(val).width;
    x.font = `500 26px ${fz}`; x.fillText(unit, px + w + 12, py + 70);
    return w + 12 + x.measureText(unit).width;
  }

  // ---------- A · halftone scan ----------
  // The figure is the project's human model (male_body.glb) rendered with simple light. That render is baked into
  // figure-a.js (bake-figure-a.ps1) so this page needs no WebGL and no file loading; its shading becomes the dot sizes.
  let shade = null;
  async function shadeA() {
    if (shade) return shade;
    const F = window.FIG_A; if (!F) throw new Error('figure-a.js がありません');
    const im = new Image(); im.src = F.img; await im.decode();
    const RW = F.rw, RH = F.rh, u = W / RW;          // layout units per pixel of the baked image
    const t = document.createElement('canvas'); t.width = RW; t.height = RH; const tx = t.getContext('2d', { willReadFrequently: true });
    tx.drawImage(im, F.box[0], F.box[1]); const img = tx.getImageData(0, 0, RW, RH).data;
    const at = (px, py) => {                         // bilinear: grey (light) and alpha (body) at a layout point
      const fx = Math.min(RW - 1.001, Math.max(0, px / u - 0.5)), fy = Math.min(RH - 1.001, Math.max(0, py / u - 0.5)), ix = fx | 0, iy = fy | 0, ax = fx - ix, ay = fy - iy;
      let L = 0, A = 0;
      for (const [dx, dy, w] of [[0, 0, (1 - ax) * (1 - ay)], [1, 0, ax * (1 - ay)], [0, 1, (1 - ax) * ay], [1, 1, ax * ay]]) {
        const i = ((iy + dy) * RW + ix + dx) * 4, a = img[i + 3] / 255; L += img[i] / 255 * a * w; A += a * w;
      }
      return [A > 0 ? L / A : 0, A];
    };
    // coarse mask, blurred, for the stray dots around the body (the particle halo)
    const MW = Math.ceil(W / 8), MH = Math.ceil(H / 8); let bl = new Float32Array(MW * MH);
    for (let j = 0; j < MH; j++) for (let i = 0; i < MW; i++) bl[j * MW + i] = at(i * 8 + 4, j * 8 + 4)[1] > 0.5 ? 1 : 0;
    for (let it = 0; it < 6; it++) { const o = new Float32Array(MW * MH); for (let j = 1; j < MH - 1; j++) for (let i = 1; i < MW - 1; i++) { let s = 0; for (let b = -1; b <= 1; b++) for (let a = -1; a <= 1; a++) s += bl[(j + b) * MW + i + a]; o[j * MW + i] = s / 9; } bl = o; }
    const near = (px, py) => bl[Math.min(MH - 1, Math.max(0, py / 8 | 0)) * MW + Math.min(MW - 1, Math.max(0, px / 8 | 0))] || 0;
    return (shade = { at, near, pts: F.pts });
  }
  async function posterA(cv, k) {
    const { at, near, pts: an } = await shadeA(), x = sheet(cv, k), rnd = seeded(11);
    // dots on a 45° screen
    const s = 15, c = Math.SQRT1_2, N = Math.ceil(1800 / s);
    x.fillStyle = C.ink;
    for (let a = -N; a <= N; a++) for (let b = -N; b <= N; b++) {
      const px = W / 2 + (a - b) * s * c, py = H / 2 + (a + b) * s * c;
      if (px < -BL || px > W + BL || py < -BL || py > H + BL) continue;
      const [L, A] = at(px, py); let rr = 0;
      if (A > 0.5) rr = s * 0.62 * Math.sqrt(0.2 + 0.8 * (1 - L));
      else { const n = near(px, py); if (n > 0.02 && rnd() < n * 0.45) rr = 1.6 + rnd() * s * 0.16; }
      const jx = (rnd() - 0.5) * 1.2, jy = (rnd() - 0.5) * 1.2;
      if (rr > 0.8) { x.beginPath(); x.arc(px + jx, py + jy, rr, 0, 7); x.fill(); }
    }
    // data read by the machine: points on the body, labels in the open space on the left
    const pts = [
      [an[0], '深部体温', '37.2', '℃'], [an[1], '心拍数', '112', 'BPM'], [an[2], '呼吸数', '18', '回/分'],
      [an[3], '血中酸素 SpO₂', '98', '%'], [an[4], '血中乳酸', '2.4', 'mmol/L'], [an[5], '大腿四頭筋 出力', '82', '%']
    ].sort((p, q) => p[0][1] - q[0][1]);
    pts.forEach(([[qx, qy], n, v, u], i) => {
      const ly = 400 + i * 178, w = label(x, 90, ly, n, v, u, C.ink), ex = 90 + w + 26, ey = ly + 52;
      x.strokeStyle = C.ink; x.lineWidth = 2.5; x.beginPath(); x.moveTo(ex, ey); x.lineTo(ex + 34, ey); x.lineTo(qx, qy); x.stroke();
      x.fillStyle = C.acc; x.beginPath(); x.arc(qx, qy, 11, 0, 7); x.fill(); x.lineWidth = 3; x.strokeStyle = C.ink; x.stroke();
    });
    // huge headline over the legs, like the reference
    x.fillStyle = C.acc; x.textAlign = 'left'; x.textBaseline = 'alphabetic';
    x.font = `900 540px ${fz}`; x.fillText('体を', 40, H - 570); x.fillText('読む', 40, H - 70);
    x.font = `600 28px ${fu}`; x.fillText('FFS', 90, 120); x.fillText('2126', 90, 154);
    x.font = `700 28px ${fz}`; x.fillText('未来フィットネスシステム', 230, 120); x.font = `500 26px ${fz}`; x.fillText('マシンが全身 128 項目をリアルタイム計測 · 概念シミュレーション', 230, 154);
    // the figure comes from a CC BY 4.0 model: the licence requires this credit on the print too
    x.fillStyle = C.ink; x.textAlign = 'right'; x.font = `500 18px ${fu}`;
    x.fillText('3D MODEL: “MALE BODY” BY ALEXANDER ANTIPOV, CC BY 4.0', W - 60, H - 40);
    grain(x, 14, rnd);
  }

  // ---------- B · geometric blocks ----------
  function rr4(x, X, Y, w, h, tl, tr, br, bl) {
    x.beginPath(); x.moveTo(X + tl, Y); x.lineTo(X + w - tr, Y); x.arcTo(X + w, Y, X + w, Y + tr, tr); x.lineTo(X + w, Y + h - br); x.arcTo(X + w, Y + h, X + w - br, Y + h, br);
    x.lineTo(X + bl, Y + h); x.arcTo(X, Y + h, X, Y + h - bl, bl); x.lineTo(X, Y + tl); x.arcTo(X, Y, X + tl, Y, tl); x.closePath();
  }
  function posterB(cv, k) {
    const x = sheet(cv, k), rnd = seeded(23);
    const M = 90, G = 24, cw = (W - 2 * M - 2 * G) / 3, top = 90, rh = (H - top - 330 - 3 * G) / 4, R = cw / 2;
    const X = i => M + i * (cw + G), Y = j => top + j * (rh + G), hh = n => n * rh + (n - 1) * G;
    // colours from the app's tiles: slate blue and olive cross over diagonally (left arm / right leg, right arm / left leg),
    // sage head, ink chest with the orange heart, light-blue belly
    const BLUE = '#5E7BA4', OLIVE = '#6F7F5A', SAGE = '#BEC3AD', LBLUE = '#A9B7C8';
    const blk = (col, ...a) => { x.fillStyle = col; rr4(x, ...a); x.fill(); };
    blk(BLUE, X(0), Y(0), cw, hh(2), R, R, 0, 0);                   // raised arms
    blk(OLIVE, X(2), Y(0), cw, hh(2), R, R, 0, 0);
    x.fillStyle = SAGE; x.beginPath(); x.arc(X(1) + cw / 2, Y(0) + rh / 2, Math.min(cw, rh) / 2, 0, 7); x.fill();   // head
    blk(C.ink, X(1), Y(1), cw, rh, 0, 0, 0, 0);                     // chest
    blk(LBLUE, X(1), Y(2), cw, rh, 0, 0, R * 0.35, R * 0.35);       // belly
    const lw = (cw - G) / 2;                                         // legs: two narrow pills under the torso
    blk(OLIVE, X(1), Y(3), lw, rh, 0, 0, lw / 2, lw / 2);
    blk(BLUE, X(1) + lw + G, Y(3), lw, rh, 0, 0, lw / 2, lw / 2);
    const hx = X(1) + cw / 2, hy = Y(1) + rh / 2, hr = Math.min(cw, rh) / 2;
    x.fillStyle = C.acc; x.beginPath(); x.arc(hx, hy, hr * 0.92, 0, 7); x.fill();   // the heart
    const inBlock = (px, py, n, v, u, al, col) => {
      x.fillStyle = col || C.ivory; x.textAlign = al || 'left';
      x.font = `700 32px ${fz}`; x.fillText(n, px, py);
      x.font = `600 92px ${fu}`; x.fillText(v, px, py + 104);
      if (u) { x.font = `500 28px ${fz}`; x.fillText(u, px, py + 150); }
    };
    inBlock(X(0) + 52, Y(1) + rh - 170, '三角筋 出力', '72%', '');
    inBlock(X(2) + 52, Y(1) + rh - 170, '血中酸素 SpO₂', '98%', '');
    inBlock(hx, Y(0) + rh / 2 - 40, '深部体温', '37.2', '℃', 'center', C.ink);
    inBlock(hx, hy - 40, '心拍数', '112', 'BPM', 'center');
    inBlock(X(1) + 52, Y(2) + 80, '血中乳酸', '2.4', 'mmol/L', 'left', C.ink);
    // the open space beside the legs: leg readings in ink, pointing at the legs
    const outside = (px, py, n, v, al, qx, qy) => {
      x.fillStyle = C.ink; x.textAlign = al; x.font = `700 32px ${fz}`; x.fillText(n, px, py); x.font = `600 92px ${fu}`; x.fillText(v, px, py + 104);
      const ex = al === 'left' ? px + x.measureText(v).width + 24 : px - x.measureText(v).width - 24;
      x.strokeStyle = C.ink; x.lineWidth = 2.5; x.beginPath(); x.moveTo(ex, py + 70); x.lineTo(qx, qy); x.stroke();
      x.fillStyle = C.acc; x.beginPath(); x.arc(qx, qy, 12, 0, 7); x.fill();
    };
    outside(X(0) + 20, Y(2) + 130, '大腿四頭筋 出力', '82%', 'left', X(1) + lw * 0.5, Y(3) + rh * 0.25);
    outside(X(2) + cw - 20, Y(2) + 130, '筋酸素 SmO₂', '64%', 'right', X(1) + lw * 1.5 + G, Y(3) + rh * 0.55);
    // a scan target with the knee load
    const tx = X(2) + cw / 2 - 40, ty = Y(3) + rh / 2 + 10;
    x.strokeStyle = C.ink; x.lineWidth = 2.5;
    for (const r of [60, 105]) { x.beginPath(); x.arc(tx, ty, r, 0, 7); x.stroke(); }
    x.beginPath(); x.moveTo(tx - 150, ty); x.lineTo(tx + 150, ty); x.moveTo(tx, ty - 150); x.lineTo(tx, ty + 150); x.stroke();
    x.fillStyle = C.acc; x.beginPath(); x.arc(tx + 36, ty - 26, 12, 0, 7); x.fill();
    x.fillStyle = C.ink; x.textAlign = 'center'; x.font = `700 30px ${fz}`; x.fillText('関節負荷 · 膝', tx, ty + 190);
    x.font = `600 48px ${fu}`; x.fillText('2.1×', tx, ty + 246);
    x.strokeStyle = C.ink; x.lineWidth = 2.5; x.beginPath(); x.moveTo(tx - 150, ty); x.lineTo(X(1) + lw * 2 + G + 4, Y(3) + rh * 0.3); x.stroke();
    // scan line across the chest, running into the bleed
    x.fillStyle = C.acc; x.fillRect(-BL, Y(1) + rh * 0.3, W + 2 * BL, 5);
    x.textAlign = 'right'; x.font = `600 22px ${fu}`; x.fillText('SCAN 064 / 128', W - 40, Y(1) + rh * 0.3 - 14);
    // footer like a series poster
    const fy = H - 170;
    x.fillStyle = C.ink; x.textAlign = 'left';
    x.font = `900 52px ${fz}`; x.fillText('未来フィットネス', M, fy);
    x.font = `600 22px ${fu}`; x.fillText('FUTURE FITNESS  |  2126 SERIES', M, fy + 42);
    x.font = `600 52px ${fu}`; x.fillText('001', M + 560, fy);
    x.font = `500 24px ${fz}`; x.fillText('全身 128 項目をリアルタイム計測', M + 560, fy + 42);
    const lx = W / 2 + 180, ly = fy - 18;
    x.beginPath(); x.arc(lx, ly, 34, 0, 7); x.fill();
    x.fillStyle = C.acc; x.beginPath(); x.moveTo(lx, ly); x.arc(lx, ly, 34, -Math.PI / 2, 0); x.closePath(); x.fill();
    x.fillStyle = C.ink; x.textAlign = 'right';
    x.font = `700 28px ${fz}`; x.fillText('すべての筋肉に、数値がある', W - M, fy - 6);
    x.font = `500 24px ${fz}`; x.fillText('データは概念シミュレーション · SIMULATED DATA', W - M, fy + 36);
    grain(x, 10, rnd);
  }

  // ---------- C · wavy hand-drawn ----------
  function posterC(cv, k) {
    const x = sheet(cv, k), rnd = seeded(37);
    // the figure on its own layer: flat colour, wavy outlines, then a mottled print texture
    const f = document.createElement('canvas'); f.width = cv.width; f.height = cv.height;
    const g = f.getContext('2d'); g.setTransform(x.getTransform());
    const kf = 1.95, ox = 950 - 548 * kf, oy = 720 - 124 * kf, T = p => [ox + p[0] * kf, oy + p[1] * kf];
    const J = { head: [560, 205], neck: [542, 292], chest: [528, 385], pel: [500, 630],
      shF: [520, 372], elF: [392, 455], haF: [318, 352], shB: [540, 372], elB: [660, 470], haB: [700, 575],
      hiF: [492, 628], knF: [348, 690], anF: [360, 880], toF: [288, 905], hiB: [510, 628], knB: [615, 780], anB: [770, 845], toB: [820, 905] };
    g.fillStyle = C.acc;
    const wavyCircle = (c, r0, amp, lobes, ph) => {
      const [px, py] = T(c); g.beginPath();
      for (let i = 0; i <= 96; i++) { const a = i / 96 * Math.PI * 2, rr = r0 * (1 + amp * Math.sin(a * lobes + ph)) * kf; i ? g.lineTo(px + Math.cos(a) * rr, py + Math.sin(a) * rr) : g.moveTo(px + Math.cos(a) * rr, py + Math.sin(a) * rr); }
      g.fill();
    };
    const limb = (a, b, wa, wb, amp, ph) => {
      const A = J[a], B = J[b], dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L, n = 40, Lp = [], Rp = [];
      for (let i = 0; i <= n; i++) {

    b.font = `600 22px ${fu}`; b.textAlign = 'right'; b.fillText('FUTURE FITNESS 2126 · RISO EDITION', W - 80, 100);
    // riso texture: ink drop-outs in each layer
    for (const g of [p, b]) { g.save(); g.globalCompositeOperation = 'destination-out'; for (let i = 0; i < 9000; i++) { g.globalAlpha = 0.25 + rnd() * 0.5; g.fillRect(rnd() * W, rnd() * H, 1 + rnd() * 3, 1 + rnd() * 3); } g.restore(); }
    x.save(); x.setTransform(1, 0, 0, 1, 0, 0); x.globalCompositeOperation = 'multiply'; x.globalAlpha = 0.92;
    x.drawImage(pc, Math.round(5 * cv.width / LW), Math.round(3 * cv.width / LW)); x.drawImage(bc, 0, 0); x.restore();   // pink slightly off register
    credit(x, BLUE);
    grain(x, 12, rnd);
  }

  const DRAW = { A: posterA, B: posterB, C: posterC, D: posterD, E: posterE, F: posterF }, msg = document.getElementById('msg');
  const save = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); };
  // JPEG from the canvas carries no resolution; write 300 dpi into its JFIF header so it opens at A1 size
  async function jpeg300(cv) {
    const b = new Uint8Array(await (await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.95))).arrayBuffer());
    if (b[6] === 0x4A && b[7] === 0x46 && b[8] === 0x49 && b[9] === 0x46) { b[13] = 1; b[14] = 1; b[15] = 44; b[16] = 1; b[17] = 44; }
    return new Blob([b], { type: 'image/jpeg' });
  }
  try { for (const id of 'BCADEF') await DRAW[id](document.getElementById('p' + id), 1); }
  catch (e) { msg.textContent = '生成エラー：' + e.message; console.error(e); }
  document.querySelectorAll('[data-prev]').forEach(b => {
    b.disabled = false;
    b.onclick = () => document.getElementById('p' + b.dataset.prev).toBlob(bl => save(bl, `future-fitness-2126-${b.dataset.prev}-preview.png`));
  });
  document.querySelectorAll('[data-print]').forEach(b => {
    b.disabled = false;
    b.onclick = async () => {
      const id = b.dataset.print, all = document.querySelectorAll('[data-print]');
      all.forEach(z => z.disabled = true); msg.textContent = `${id} を A1 · 300 dpi（${PRINT_W} × ${PRINT_H} px）で書き出し中…`;
      await new Promise(r => setTimeout(r, 30));
      try {
        const cv = document.createElement('canvas'); await DRAW[id](cv, 'print');
        save(await jpeg300(cv), `future-fitness-2126-${id}-A1-300dpi-bleed3mm.jpg`);
        cv.width = cv.height = 1;
        msg.textContent = `${id} を書き出しました（${PRINT_W} × ${PRINT_H} px、300 dpi、塗り足し 3 mm 込み）。`;
      } catch (e) { msg.textContent = '書き出しエラー：' + e.message; console.error(e); }
      all.forEach(z => z.disabled = false);
    };
  });
})();
</script>
