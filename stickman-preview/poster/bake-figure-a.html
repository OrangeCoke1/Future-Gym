<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>bake figure A</title>
</head>
<body>
<!-- Renders male_body.glb once (same camera and light as poster A) and prints the shading image + label anchor points as
     JSON into #out. bake-figure-a.ps1 runs this page in headless Edge and saves the result as figure-a.js, so the poster
     page itself needs neither WebGL nor the model file (it also works when opened by double-click). -->
<pre id="out"></pre>
<script src="../three.min.js"></script>
<script>
(async () => {
  const W = 1800, H = 1800 * 841 / 594, S = 11.4, FX = 1080, FY = H - 150, RW = 450, RH = Math.round(RW * H / W);
  const buf = await (await fetch('../male_body.glb')).arrayBuffer(), dv = new DataView(buf);
  const jl = dv.getUint32(12, true), json = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 20, jl))), bin = 20 + jl + 8;
  const prim = json.meshes[0].primitives[0];
  const read = (ai, T, n) => { const a = json.accessors[ai], bv = json.bufferViews[a.bufferView], o = bin + (bv.byteOffset || 0) + (a.byteOffset || 0); return new T(buf.slice(o, o + a.count * n * T.BYTES_PER_ELEMENT)); };
  const ia = json.accessors[prim.indices], geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(read(prim.attributes.POSITION, Float32Array, 3), 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(read(prim.attributes.NORMAL, Float32Array, 3), 3));
  geo.setIndex(new THREE.BufferAttribute(read(prim.indices, ia.componentType === 5125 ? Uint32Array : Uint16Array, 1), 1));
  const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  r.setPixelRatio(1); r.setSize(RW, RH); r.setClearColor(0x000000, 0);
  const scene = new THREE.Scene(), mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: 0xffffff }));
  mesh.rotation.y = -0.42; scene.add(mesh); mesh.updateMatrixWorld();
  const dl = new THREE.DirectionalLight(0xffffff, 1.05); dl.position.set(-1.3, 1.1, 1.4); scene.add(dl, new THREE.AmbientLight(0xffffff, 0.12));
  const vw = W / S, vh = H / S, cx = -(FX - W / 2) / S, cy = (FY - H / 2) / S;
  const cam = new THREE.OrthographicCamera(cx - vw / 2, cx + vw / 2, cy + vh / 2, cy - vh / 2, 1, 2000); cam.position.set(0, 0, 600);
  r.render(scene, cam);
  const t = document.createElement('canvas'); t.width = RW; t.height = RH; const tx = t.getContext('2d'); tx.drawImage(r.domElement, 0, 0);
  const d = tx.getImageData(0, 0, RW, RH).data; let x0 = RW, y0 = RH, x1 = 0, y1 = 0;
  for (let y = 0; y < RH; y++) for (let x = 0; x < RW; x++) if (d[(y * RW + x) * 4 + 3] > 8) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  x0 = Math.max(0, x0 - 2); y0 = Math.max(0, y0 - 2); x1 = Math.min(RW - 1, x1 + 2); y1 = Math.min(RH - 1, y1 + 2);
  const c = document.createElement('canvas'); c.width = x1 - x0 + 1; c.height = y1 - y0 + 1; c.getContext('2d').drawImage(t, x0, y0, c.width, c.height, 0, 0, c.width, c.height);
  const P = (wx, wy, wz) => { const v = new THREE.Vector3(wx, wy, wz).applyMatrix4(mesh.matrixWorld).project(cam); return [Math.round((v.x + 1) / 2 * W), Math.round((1 - v.y) / 2 * H)]; };
  // label anchors (cm on the model): head, heart, lung, right hand, belly, right thigh
  const pts = [P(0, 166, 9), P(5, 133, 11), P(-9, 127, 11), P(-50, 86, 13), P(1, 104, 12), P(-12, 68, 9)];
  document.getElementById('out').textContent = JSON.stringify({ rw: RW, rh: RH, box: [x0, y0, c.width, c.height], pts, img: c.toDataURL('image/png') });
})().catch(e => { document.getElementById('out').textContent = 'ERROR ' + e.message; });
</script>
</body>
</html>
